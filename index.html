<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- prettier-ignore -->
		<link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
		<title>Frontend Mentor | Time tracking dashboard</title>
		<link rel="stylesheet" href="./dist/styles.css" />
		<script src="./js/main.js" defer></script>
	</head>
	<body
		class="bg-neutral-navy-950 text-white py-20 px-6 md:grid md:min-h-screen md:place-items-center"
	>
		<main class="w-full md:max-w-[85%] lg:max-w-[80.1725%] lg:grid lg:grid-cols-4 lg:gap-8">
			<header class="bg-neutral-navy-900 rounded-[0.938rem] lg:row-span-2">
				<div
					class="headings lg:block bg-primary-purple-600 p-8 grid gap-6 grid-cols-[4rem_1fr] items-center rounded-[0.938rem]"
				>
					<div class="outline-white outline-2 rounded-full lg:w-19.5">
						<img src="./images/image-jeremy.png" alt="" class="w-full" />
					</div>
					<h1 class="lg:mt-10 lg:w-min">
						<span
							class="text-neutral-navy-200 block text-[0.938rem] leading-6 lg:leading-4.5"
							>Report for</span
						>
						<span
							class="text-[1.5rem] lg:text-[2.5rem] leading-7 font-light lg:leading-11.75 block"
						>
							Jeremy Robson
						</span>
					</h1>
				</div>
				<div
					class="buttons pt-6 pb-6 grid grid-cols-3 bg-neutral-navy-900 rounded-[0.938rem] md:max-w-[56.0458%] mx-auto lg:max-w-none lg:grid-cols-1 lg:gap-6 lg:p-8"
					role="group"
					aria-label="Timeframe"
				>
					<button
						aria-pressed="false"
						class="cursor-pointer text-[1.125rem] leading-[1.313rem] text-neutral-purple-500 aria-pressed:text-white hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white lg:text-left"
						data-period="Daily"
					>
						Daily
					</button>
					<button
						aria-pressed="true"
						class="cursor-pointer text-[1.125rem] leading-[1.313rem] text-neutral-purple-500 aria-pressed:text-white hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white lg:text-left"
						data-period="Weekly"
					>
						Weekly
					</button>
					<button
						aria-pressed="false"
						class="cursor-pointer text-[1.125rem] leading-[1.313rem] text-neutral-purple-500 aria-pressed:text-white hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white lg:text-left"
						data-period="Monthly"
					>
						Monthly
					</button>
				</div>
			</header>

			<div class="cards mt-6 lg:mt-0 grid gap-6 md:grid-cols-3 lg:grid-cols-subgrid lg:grid-rows-subgrid lg:col-span-3 lg:row-span-2 lg:gap-[inherit]">
				<!-- work -->
				<div
					class="card-outer pt-9.5 md:pt-8 lg:pt-11 bg-primary-orange-300 rounded-[0.938rem] bg-[url(../images/icon-work.svg)] bg-no-repeat bg-position-[top_-1rem_right_1rem]"
					data-title="Work"
				>
					<div
						class="card-inner rounded-[0.938rem] bg-neutral-navy-900 p-6 hover:not-[:has(button:hover)]:bg-neutral-navy-800 transition-colors duration-150"
					>
						<div class="top flex w-full justify-between items-center">
							<h2 class="text-[1.125rem] leading-6 font-medium">Work</h2>

							<button
								class="cursor-pointer group px-1 py-3 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
								aria-label="See details for Work"
							>
								<svg
									xmlns="http://www.w3.org/2000/svg"
									width="21"
									height="5"
									viewBox="0 0 21 5"
									fill="none"
									class="text-neutral-navy-200 group-hover:text-white transition-colors duration-150"
									aria-hidden="true"
								>
									<path
										fill-rule="evenodd"
										clip-rule="evenodd"
										d="M5 2.5C5 3.88071 3.88071 5 2.5 5C1.11929 5 0 3.88071 0 2.5C0 1.11929 1.11929 0 2.5 0C3.88071 0 5 1.11929 5 2.5ZM13 2.5C13 3.88071 11.8807 5 10.5 5C9.11929 5 8 3.88071 8 2.5C8 1.11929 9.11929 0 10.5 0C11.8807 0 13 1.11929 13 2.5ZM18.5 5C19.8807 5 21 3.88071 21 2.5C21 1.11929 19.8807 0 18.5 0C17.1193 0 16 1.11929 16 2.5C16 3.88071 17.1193 5 18.5 5Z"
										fill="currentColor"
									/>
								</svg>
							</button>
						</div>

						<div
							class="bottom mt-2 md:mt-4 flex w-full justify-between items-center md:block"
						>
							<p
								class="hours text-[2rem] md:text-[3.5rem] leading-9.5 md:leading-16.5 font-light"
							>
								32hrs
							</p>
							<p
								class="last-week text-[0.938rem] leading-4.5 text-neutral-navy-200 md:mt-2"
							>
								Last Week - 36hrs
							</p>
						</div>
					</div>
				</div>
				<!-- play -->
				<div
					class="card-outer pt-9.5 md:pt-8 lg:pt-11 bg-primary-blue-300 rounded-[0.938rem] bg-[url(../images/icon-play.svg)] bg-no-repeat bg-position-[top_-1rem_right_1rem]"
					data-title="Play"
				>
					<div
						class="card-inner rounded-[0.938rem] bg-neutral-navy-900 p-6 hover:not-[:has(button:hover)]:bg-neutral-navy-800 transition-colors duration-150"
					>
						<div class="top flex w-full justify-between items-center">
							<h2 class="text-[1.125rem] leading-6 font-medium">Play</h2>

							<button
								class="cursor-pointer group px-1 py-3 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
								aria-label="See details for Play"
							>
								<svg
									xmlns="http://www.w3.org/2000/svg"
									width="21"
									height="5"
									viewBox="0 0 21 5"
									fill="none"
									class="text-neutral-navy-200 group-hover:text-white transition-colors duration-150"
									aria-hidden="true"
								>
									<path
										fill-rule="evenodd"
										clip-rule="evenodd"
										d="M5 2.5C5 3.88071 3.88071 5 2.5 5C1.11929 5 0 3.88071 0 2.5C0 1.11929 1.11929 0 2.5 0C3.88071 0 5 1.11929 5 2.5ZM13 2.5C13 3.88071 11.8807 5 10.5 5C9.11929 5 8 3.88071 8 2.5C8 1.11929 9.11929 0 10.5 0C11.8807 0 13 1.11929 13 2.5ZM18.5 5C19.8807 5 21 3.88071 21 2.5C21 1.11929 19.8807 0 18.5 0C17.1193 0 16 1.11929 16 2.5C16 3.88071 17.1193 5 18.5 5Z"
										fill="currentColor"
									/>
								</svg>
							</button>
						</div>

						<div
							class="bottom mt-2 md:mt-4 flex w-full justify-between items-center md:block"
						>
							<p
								class="hours text-[2rem] md:text-[3.5rem] leading-9.5 md:leading-16.5 font-light"
							>
								10hrs
							</p>
							<p
								class="last-week text-[0.938rem] leading-4.5 text-neutral-navy-200 md:mt-2"
							>
								Last Week - 8hrs
							</p>
						</div>
					</div>
				</div>
				<!-- study -->
				<div
					class="card-outer pt-9.5 md:pt-8 lg:pt-11 bg-primary-pink-400 rounded-[0.938rem] bg-[url(../images/icon-study.svg)] bg-no-repeat bg-position-[top_-1rem_right_1rem]"
					data-title="Study"
				>
					<div
						class="card-inner rounded-[0.938rem] bg-neutral-navy-900 p-6 hover:not-[:has(button:hover)]:bg-neutral-navy-800 transition-colors duration-150"
					>
						<div class="top flex w-full justify-between items-center">
							<h2 class="text-[1.125rem] leading-6 font-medium">Study</h2>

							<button
								class="cursor-pointer group px-1 py-3 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
								aria-label="See details for Study"
							>
								<svg
									xmlns="http://www.w3.org/2000/svg"
									width="21"
									height="5"
									viewBox="0 0 21 5"
									fill="none"
									class="text-neutral-navy-200 group-hover:text-white transition-colors duration-150"
									aria-hidden="true"
								>
									<path
										fill-rule="evenodd"
										clip-rule="evenodd"
										d="M5 2.5C5 3.88071 3.88071 5 2.5 5C1.11929 5 0 3.88071 0 2.5C0 1.11929 1.11929 0 2.5 0C3.88071 0 5 1.11929 5 2.5ZM13 2.5C13 3.88071 11.8807 5 10.5 5C9.11929 5 8 3.88071 8 2.5C8 1.11929 9.11929 0 10.5 0C11.8807 0 13 1.11929 13 2.5ZM18.5 5C19.8807 5 21 3.88071 21 2.5C21 1.11929 19.8807 0 18.5 0C17.1193 0 16 1.11929 16 2.5C16 3.88071 17.1193 5 18.5 5Z"
										fill="currentColor"
									/>
								</svg>
							</button>
						</div>

						<div
							class="bottom mt-2 md:mt-4 flex w-full justify-between items-center md:block"
						>
							<p
								class="hours text-[2rem] md:text-[3.5rem] leading-9.5 md:leading-16.5 font-light"
							>
								4hrs
							</p>
							<p
								class="last-week text-[0.938rem] leading-4.5 text-neutral-navy-200 md:mt-2"
							>
								Last Week - 7hrs
							</p>
						</div>
					</div>
				</div>
				<!-- exercise -->
				<div
					class="card-outer pt-9.5 md:pt-8 lg:pt-11 bg-primary-green-400 rounded-[0.938rem] bg-[url(../images/icon-exercise.svg)] bg-no-repeat bg-position-[top_-1rem_right_1rem]"
					data-title="Exercise"
				>
					<div
						class="card-inner rounded-[0.938rem] bg-neutral-navy-900 p-6 hover:not-[:has(button:hover)]:bg-neutral-navy-800 transition-colors duration-150"
					>
						<div class="top flex w-full justify-between items-center">
							<h2 class="text-[1.125rem] leading-6 font-medium">Exercise</h2>

							<button
								class="cursor-pointer group px-1 py-3 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
								aria-label="See details for Exercise"
							>
								<svg
									xmlns="http://www.w3.org/2000/svg"
									width="21"
									height="5"
									viewBox="0 0 21 5"
									fill="none"
									class="text-neutral-navy-200 group-hover:text-white transition-colors duration-150"
									aria-hidden="true"
								>
									<path
										fill-rule="evenodd"
										clip-rule="evenodd"
										d="M5 2.5C5 3.88071 3.88071 5 2.5 5C1.11929 5 0 3.88071 0 2.5C0 1.11929 1.11929 0 2.5 0C3.88071 0 5 1.11929 5 2.5ZM13 2.5C13 3.88071 11.8807 5 10.5 5C9.11929 5 8 3.88071 8 2.5C8 1.11929 9.11929 0 10.5 0C11.8807 0 13 1.11929 13 2.5ZM18.5 5C19.8807 5 21 3.88071 21 2.5C21 1.11929 19.8807 0 18.5 0C17.1193 0 16 1.11929 16 2.5C16 3.88071 17.1193 5 18.5 5Z"
										fill="currentColor"
									/>
								</svg>
							</button>
						</div>

						<div
							class="bottom mt-2 md:mt-4 flex w-full justify-between items-center md:block"
						>
							<p
								class="hours text-[2rem] md:text-[3.5rem] leading-9.5 md:leading-16.5 font-light"
							>
								4hrs
							</p>
							<p
								class="last-week text-[0.938rem] leading-4.5 text-neutral-navy-200 md:mt-2"
							>
								Last Week - 5hrs
							</p>
						</div>
					</div>
				</div>
				<!-- social -->
				<div
					class="card-outer pt-9.5 md:pt-8 lg:pt-11 bg-primary-purple-700 rounded-[0.938rem] bg-[url(../images/icon-social.svg)] bg-no-repeat bg-position-[top_-1rem_right_1rem]"
					data-title="Social"
				>
					<div
						class="card-inner rounded-[0.938rem] bg-neutral-navy-900 p-6 hover:not-[:has(button:hover)]:bg-neutral-navy-800 transition-colors duration-150"
					>
						<div class="top flex w-full justify-between items-center">
							<h2 class="text-[1.125rem] leading-6 font-medium">Social</h2>

							<button
								class="cursor-pointer group px-1 py-3 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
								aria-label="See details for Social"
							>
								<svg
									xmlns="http://www.w3.org/2000/svg"
									width="21"
									height="5"
									viewBox="0 0 21 5"
									fill="none"
									class="text-neutral-navy-200 group-hover:text-white transition-colors duration-150"
									aria-hidden="true"
								>
									<path
										fill-rule="evenodd"
										clip-rule="evenodd"
										d="M5 2.5C5 3.88071 3.88071 5 2.5 5C1.11929 5 0 3.88071 0 2.5C0 1.11929 1.11929 0 2.5 0C3.88071 0 5 1.11929 5 2.5ZM13 2.5C13 3.88071 11.8807 5 10.5 5C9.11929 5 8 3.88071 8 2.5C8 1.11929 9.11929 0 10.5 0C11.8807 0 13 1.11929 13 2.5ZM18.5 5C19.8807 5 21 3.88071 21 2.5C21 1.11929 19.8807 0 18.5 0C17.1193 0 16 1.11929 16 2.5C16 3.88071 17.1193 5 18.5 5Z"
										fill="currentColor"
									/>
								</svg>
							</button>
						</div>

						<div
							class="bottom mt-2 md:mt-4 flex w-full justify-between items-center md:block"
						>
							<p
								class="hours text-[2rem] md:text-[3.5rem] leading-9.5 md:leading-16.5 font-light"
							>
								5hrs
							</p>
							<p
								class="last-week text-[0.938rem] leading-4.5 text-neutral-navy-200 md:mt-2"
							>
								Last Week - 10hrs
							</p>
						</div>
					</div>
				</div>
				<!-- self care -->
				<div
					class="card-outer pt-9.5 md:pt-8 lg:pt-11 bg-primary-yellow-300 rounded-[0.938rem] bg-[url(../images/icon-self-care.svg)] bg-no-repeat bg-position-[top_-1rem_right_1rem]"
					data-title="Self Care"
				>
					<div
						class="card-inner rounded-[0.938rem] bg-neutral-navy-900 p-6 hover:not-[:has(button:hover)]:bg-neutral-navy-800 transition-colors duration-150"
					>
						<div class="top flex w-full justify-between items-center">
							<h2 class="text-[1.125rem] leading-6 font-medium">Self Care</h2>

							<button
								class="cursor-pointer group px-1 py-3 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
								aria-label="See details for Self Care"
							>
								<svg
									xmlns="http://www.w3.org/2000/svg"
									width="21"
									height="5"
									viewBox="0 0 21 5"
									fill="none"
									class="text-neutral-navy-200 group-hover:text-white transition-colors duration-150"
									aria-hidden="true"
								>
									<path
										fill-rule="evenodd"
										clip-rule="evenodd"
										d="M5 2.5C5 3.88071 3.88071 5 2.5 5C1.11929 5 0 3.88071 0 2.5C0 1.11929 1.11929 0 2.5 0C3.88071 0 5 1.11929 5 2.5ZM13 2.5C13 3.88071 11.8807 5 10.5 5C9.11929 5 8 3.88071 8 2.5C8 1.11929 9.11929 0 10.5 0C11.8807 0 13 1.11929 13 2.5ZM18.5 5C19.8807 5 21 3.88071 21 2.5C21 1.11929 19.8807 0 18.5 0C17.1193 0 16 1.11929 16 2.5C16 3.88071 17.1193 5 18.5 5Z"
										fill="currentColor"
									/>
								</svg>
							</button>

						<div
							class="bottom mt-2 md:mt-4 flex w-full justify-between items-center md:block"
						>
							<p
								class="hours text-[2rem] md:text-[3.5rem] leading-9.5 md:leading-16.5 font-light"
							>
								2hrs
							</p>
							<p
								class="last-week text-[0.938rem] leading-4.5 text-neutral-navy-200 md:mt-2"
							>
								Last Week - 2hrs
							</p>
						</div>
					</div>
				</div>
			</div>
		</main>
	</body>
</html>
